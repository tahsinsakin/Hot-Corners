<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hot Corners</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="head">
      <img src="icons/icon48.png" alt="" width="30" height="30" id="logo">
      <div class="brand">
        <h1>Hot Corners</h1>
        <p id="status">On</p>
      </div>
      <label class="switch" title="Turn Hot Corners on or off">
        <input type="checkbox" id="enabled" aria-label="Turn Hot Corners on or off">
        <span></span>
      </label>
    </header>

    <div class="row-box pause" id="pauseRow">
      <div class="row-text">
        <strong>Pause</strong>
        <span id="pauseState">Take a break; it comes back on by itself</span>
      </div>
      <div class="seg" id="pauseButtons" role="group" aria-label="Pause length">
        <button type="button" data-minutes="15">15 min</button>
        <button type="button" data-minutes="60">1 hr</button>
        <button type="button" data-minutes="-1" title="Until Chrome restarts">Session</button>
      </div>
      <button class="btn primary" id="resume" type="button" hidden>Resume</button>
    </div>

    <div class="row-box site needs-on" id="siteRow" hidden>
      <div class="row-text">
        <strong id="siteHost"></strong>
        <span id="siteState">Working on this site</span>
      </div>
      <label class="switch small">
        <input type="checkbox" id="siteOn" aria-label="Work on this site">
        <span></span>
      </label>
    </div>

    <div class="stage">
      <section class="screen" id="screen" aria-label="Corner actions">
        <div class="screen-center">Rest in a corner,<br>the action runs</div>
      </section>
    </div>

    <footer class="foot">
      <dl class="keys">
        <div><dt>On / off</dt><dd id="keyToggle"></dd></div>
        <div><dt>Tab overview</dt><dd id="keyOverview"></dd></div>
      </dl>
      <button class="btn" id="more" type="button">All settings</button>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
